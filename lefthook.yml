# Hooks git (https://lefthook.dev). Installés par `pnpm install` (script `prepare`).
# Désactiver ponctuellement : `LEFTHOOK=0 git commit …`

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,mjs,json,jsonc,css,md,yml,yaml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    rustfmt:
      glob: "src-tauri/**/*.rs"
      run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
