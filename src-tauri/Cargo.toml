[package]
name = "relay"
version = "0.11.0"
description = "Relay — client de bureau pour OpenRouter"
authors = ["you"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sur Windows.
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `unstable` : webviews enfants (`Window::add_child`) pour le navigateur intégré.
tauri = { version = "2.12", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-log = "2.10"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-os = "2.4"
tauri-plugin-process = "2.4"
tauri-plugin-sql = { version = "2.6", features = ["sqlite"] }
tauri-plugin-store = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip"] }
tokio = { version = "1", features = ["sync", "macros", "process", "time", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Mode agent : diff des écritures, parcours respectant .gitignore, recherche, chemins canoniques lisibles.
similar = "2"
ignore = "0.4"
globset = "0.4"
regex = "1"
dunce = "1"
# Navigateur et outil `fetch_url` : HTML -> texte lisible pour le modèle.
html2text = "0.16"
url = "2"

# Outils navigateur de l'agent : évaluation de script avec valeur de retour, par plateforme
# (versions alignées sur celles de `wry`, déjà dans l'arbre).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSData", "NSJSONSerialization", "NSObject"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }
javascriptcore-rs = "1.1"

[dev-dependencies]
# Tests d'intégration réseau (`cargo test -- --ignored`).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Plugins disponibles uniquement sur desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"

# Compilation de dev : relances rapides.
[profile.dev]
incremental = true

# Compilation de release : binaire petit et rapide.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
