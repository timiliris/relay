[package]
name = "relay"
version = "0.1.1"
description = "Relay — client de bureau pour OpenRouter"
authors = ["you"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
# Le suffixe `_lib` évite un conflit de nom avec le binaire sur Windows.
name = "relay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-log = "2.10"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-os = "2.4"
tauri-plugin-process = "2.4"
tauri-plugin-sql = { version = "2.6", features = ["sqlite"] }
tauri-plugin-store = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
thiserror = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "gzip"] }
tokio = { version = "1", features = ["sync", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
# Tests d'intégration réseau (`cargo test -- --ignored`).
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# Plugins disponibles uniquement sur desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2.7"
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14"
tauri-plugin-window-state = "2.5"

# Compilation de dev : relances rapides.
[profile.dev]
incremental = true

# Compilation de release : binaire petit et rapide.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
