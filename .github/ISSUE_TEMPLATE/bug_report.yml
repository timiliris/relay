name: Rapport de bug
description: Un comportement inattendu dans l'application
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version de l'application
      placeholder: "0.1.0 (Paramètres → À propos)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Système
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: "1. …\n2. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Fichier `app.log` du dossier de logs (voir README, « Notes par plateforme »).
      render: text
